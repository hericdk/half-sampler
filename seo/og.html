<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* (the user) the share card, 1200 × 630: what it is in one look — tap, record, it is music — simple and a little magic */
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; font-family: "Space Grotesk", sans-serif; color: #111; position: relative;
  background-color: #e6e6e3; background-image: conic-gradient(#dcdcd8 25%, transparent 0 50%, #dcdcd8 0 75%, transparent 0); background-size: 4px 4px; }
.left { position: absolute; left: 64px; top: 56px; width: 560px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .16em; font-size: 18px; }
.brand svg { width: 30px; height: 30px; }
h1 { font-size: 78px; line-height: .98; letter-spacing: -.035em; margin: 26px 0 18px; }
h1 em { font-style: normal; color: #ff5a1f; }
.sub { font-size: 25px; line-height: 1.3; color: #3a3a3a; font-weight: 500; }
.steps { display: flex; gap: 10px; margin-top: 28px; }
.st { display: flex; align-items: center; gap: 10px; background: #0b0b0b; color: #fff; border-radius: 12px; padding: 12px 15px; font-size: 18px; font-weight: 700; box-shadow: 0 4px 0 #000; }
.st b { width: 26px; height: 26px; border-radius: 50%; background: #ff5a1f; display: grid; place-items: center; font-size: 15px; }
.st i { color: #ff5a1f; }
.url { position: absolute; left: 64px; bottom: 44px; display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 700; }
.url span { background: #ff5a1f; color: #fff; padding: 8px 16px; border-radius: 99px; box-shadow: 0 4px 0 #9c3410; }
.url small { font-size: 18px; color: #555; font-weight: 500; }
.right { position: absolute; right: -70px; top: 70px; width: 640px; perspective: 1400px; }
.dev { width: 100%; border-radius: 20px; transform: rotateY(-16deg) rotateX(6deg) rotateZ(1deg); box-shadow: -18px 22px 0 #0b0b0b, -30px 40px 60px rgba(0,0,0,.35); display: block; }
.spark { position: absolute; width: 8px; height: 8px; background: #ff5a1f; box-shadow: 0 -8px 0 #ff5a1f, 0 8px 0 #ff5a1f, -8px 0 0 #ff5a1f, 8px 0 0 #ff5a1f; }
.spark.w { background: #fff; box-shadow: 0 -8px 0 #fff, 0 8px 0 #fff, -8px 0 0 #fff, 8px 0 0 #fff; }
.note { position: absolute; color: #ff5a1f; font-size: 34px; }
.party { position: absolute; right: 70px; bottom: 26px; display: flex; gap: 12px; align-items: flex-end; }
.guy { width: 46px; border-radius: 23px 23px 6px 6px; background: #ff5a1f; position: relative; box-shadow: inset -6px 0 0 #c7440f, 0 5px 0 #0b0b0b; }
.guy::before, .guy::after { content: ""; position: absolute; top: 13px; width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 62% 52%, #111 0 3.2px, #fff 3.6px); }   /* (the user) round eyes, as the effects' little characters */
.guy::before { left: 7px; } .guy::after { right: 10px; }
.guy i { position: absolute; left: 6px; right: 10px; bottom: 6px; height: 5px; }
</style></head><body>
<div class="left">
  <div class="brand"><svg viewBox="0 0 64 64"><path d="M32 14a18 18 0 0 0 0 36z" fill="#ff5a1f"/><circle cx="32" cy="32" r="18" fill="none" stroke="#111" stroke-width="5"/></svg>FM-½ · SAMPLER</div>
  <h1>Toque. Grave.<br><em>Faça música.</em></h1>
  <p class="sub">Um sampler grátis no navegador. Toque com o teclado, o celular ou um teclado MIDI.</p>
  <div class="steps">
    <div class="st"><b>1</b><i class="fa-solid fa-hand-pointer"></i>toque</div>
    <div class="st"><b>2</b><i class="fa-solid fa-microphone"></i>grave</div>
    <div class="st"><b>3</b><i class="fa-solid fa-wand-magic-sparkles"></i>faça sua mágica!</div>
  </div>
</div>
<div class="url"><span>sampler.half.social</span><small>abra e toque, sem instalar</small></div>
<div class="right"><img class="dev" src="device.png" alt=""></div>
<i class="spark" style="left:640px;top:96px"></i><i class="spark w" style="left:1120px;top:60px"></i><i class="spark" style="left:1150px;top:300px;transform:scale(.6)"></i><i class="spark w" style="left:700px;top:420px;transform:scale(.7)"></i>
<i class="note fa-solid fa-music" style="left:676px;top:150px"></i><i class="note fa-solid fa-music" style="left:1100px;top:120px;font-size:24px;color:#111"></i>
<div class="party">
  <div class="guy" style="height:70px"><i style="background:#ff5a1f"></i></div>
  <div class="guy" style="height:90px;transform:translateY(-14px)"><i style="background:#ff3d8a"></i></div>
  <div class="guy" style="height:76px"><i style="background:#5aa0ff"></i></div>
  <div class="guy" style="height:84px;transform:translateY(-6px)"><i style="background:#2ec27e"></i></div>
</div>
</body></html>
