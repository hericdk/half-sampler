<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMS VZ teste</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #111; color: #ddd; font: 12px/1.4 ui-monospace, Menlo, monospace; }
  header { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 12px; }
  figure { margin: 0; }
  canvas { width: 480px; height: 480px; max-width: 100%; image-rendering: pixelated; display: block; background: #000; }
  figcaption { padding: 4px 0; }
  label { display: inline-flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <strong>No Man Sky FM · VZ (22)</strong>
  <label><input type="checkbox" id="auto" checked> knob automático</label>
  <label>knob <input type="range" id="k1" min="0" max="1000" value="500"></label>
  <label>knob2 <input type="range" id="k2" min="0" max="1000" value="300"></label>
  <label><input type="checkbox" id="play" checked> playing</label>
  <span id="info"></span>
</header>
<div class="grid" id="grid"></div>
<script src="core.js"></script>
<script src="nms-vz.js"></script>
<script>
(function () {
  const V = window.FM1VIS, list = V.list.filter((v) => v.fam === 'No Man Sky FM');
  const grid = document.getElementById('grid'), $ = (id) => document.getElementById(id);
  const items = list.map((v) => {
    const f = document.createElement('figure'), c = document.createElement('canvas'), cap = document.createElement('figcaption');
    c.width = v.w; c.height = v.h; cap.textContent = v.name + '  (' + v.id + ')';
    f.append(c, cap); grid.append(f);
    const ctx = c.getContext('2d');
    return { v, S: V.state(v), ctx, img: ctx.createImageData(v.w, v.h) };
  });
  const A = V.audio();
  let ph = 0, seed = 1, t0 = performance.now(), lastKick = -1, f = 0;
  const rnd = () => ((seed = (Math.imul(seed, 1103515245) + 12345) >>> 0) / 4294967296);
  let acc = 0, prev = t0;
  function step(now) {
    acc += Math.min(100, now - prev); prev = now;
    while (acc >= 17) {                                   /* the firmware's frame: ~17 ms */
      acc -= 17; f++;
      const ms = f * 17, sweep = (ms % 8000) / 8000;
      const freq = 60 * Math.pow(2, sweep * 5);           /* a sine sweep, 60 Hz .. 1.9 kHz over 8 s */
      const kickNow = Math.floor(ms / 500);
      A.kick = kickNow !== lastKick ? 1 : 0; lastKick = kickNow;
      const intoKick = ms % 500, burst = (ms % 2000) < 150;   /* noise bursts: 150 ms every 2 s */
      for (let n = 0; n < 375; n++) {                     /* 17 ms at 22 050 Hz */
        ph += 2 * Math.PI * freq / 22050;
        const kt = (intoKick + n / 22.05) / 1000, kick = kt < 0.25 ? Math.sin(2 * Math.PI * 55 * kt) * Math.exp(-kt * 14) * 0.7 : 0;
        let x = 0.35 * Math.sin(ph) + kick + (burst ? (rnd() * 2 - 1) * 0.6 : 0);
        x = Math.max(-1, Math.min(1, x));
        const q = Math.round(x * 32767);
        A.scope_buf[A.scope_w & 511] = q; A.scope_bufr[A.scope_w & 511] = q; A.scope_w = (A.scope_w + 1) >>> 0;
      }
      A.ms = ms >>> 0; A.frame = f >>> 0; A.playing = $('play').checked ? 1 : 0; A.bpm = 120;
      A.beat_q8 = Math.floor(ms * A.bpm / 60000 * 256);
      if ($('auto').checked) { A.knob = Math.round(500 - 500 * Math.cos(ms / 6000 * Math.PI)); $('k1').value = A.knob; }
      else A.knob = +$('k1').value;
      A.knob2 = +$('k2').value;
    }
    for (const it of items) { it.v.draw(it.S, A); V.blit(it.S.fb, it.img); it.ctx.putImageData(it.img, 0, 0); }
    $('info').textContent = 'knob ' + A.knob + '  frame ' + A.frame;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
